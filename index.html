<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>GRADE EVALUATION FORM</title>
</head>

<body>

    <div class="container">

        <h1>SIMPLE SCORE EVALUATION</h1>

        <p>Clicked the Button to start and see your score</p>

        <button onclick="startEvaluation()">START</button>

        <h2>YOUR RESULT WILL APPEAR HERE</h2>

        <div class="result-container">

            <p>
                <strong>NAME:</strong>
                <span id="nameResult">---</span>
            </p>

            <p>
                <strong>GRADE:</strong>
                <span id="gradeResult">---</span>
            </p>

            <p>
                <strong>REMARK:</strong>
                <span id="remarkResult">---</span>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
